name: "Solana SDK Doctor"
description: "Catch docs-vs-reality drift in Solana & oracle SDKs (dead keyless endpoints, removed RPC methods, renamed packages) and fail/comment on PRs."
author: "solana-sdk-doctor contributors"
branding:
  icon: "activity"
  color: "purple"

inputs:
  path:
    description: "Directory to scan (monorepos are walked recursively)."
    default: "."
  offline:
    description: "Use cached rule verdicts instead of live-probing endpoints."
    default: "false"
  fail-on:
    description: "Lowest status that fails the job: fail | warn | never."
    default: "fail"
  rules:
    description: "Extra rule-pack JSON files, comma or newline separated."
    default: ""
  disable:
    description: "Comma-separated rule ids to skip."
    default: ""
  rpc-url:
    description: "Solana RPC URL, or the keyword solami (uses solami-api-key / SOLAMI_API_KEY). Defaults to Solami when a key is set, else public mainnet-beta."
    default: ""
  solami-api-key:
    description: "Solami API key (never logged). When set, live probes and on-chain checks use https://rpc.solami.dev/sol."
    default: ""
  comment:
    description: "Post / update a sticky PR comment with the report (pull_request events only)."
    default: "true"
  github-token:
    description: "Token used to post the PR comment. Needs pull-requests: write."
    default: ${{ github.token }}
  node-version:
    description: "Node.js version used to run the doctor."
    default: "20"

outputs:
  exit-code:
    description: "0 = clean, 1 = drift at or above fail-on, 2 = configuration error."
    value: ${{ steps.doctor.outputs.exit-code }}
  fail-count:
    description: "Number of FAIL findings."
    value: ${{ steps.doctor.outputs.fail-count }}
  warn-count:
    description: "Number of WARN findings."
    value: ${{ steps.doctor.outputs.warn-count }}
  report-json:
    description: "Path to the JSON report."
    value: ${{ steps.doctor.outputs.report-json }}
  report-markdown:
    description: "Path to the Markdown report."
    value: ${{ steps.doctor.outputs.report-markdown }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # No install/build step: the CLI ships pre-bundled (zero runtime deps) in action-dist/cli.js,
    # regenerated by `npm run bundle` and verified fresh in CI.
    - name: Check bundled CLI
      shell: bash
      run: |
        if [ ! -f "$GITHUB_ACTION_PATH/action-dist/cli.js" ]; then
          echo "::error title=Solana SDK Doctor::action-dist/cli.js is missing from this ref. Run 'npm run bundle' and commit action-dist/."
          exit 2
        fi

    - name: Run solana-sdk-doctor
      id: doctor
      shell: bash
      env:
        SDK_DOCTOR_PATH: ${{ inputs.path }}
        SDK_DOCTOR_OFFLINE: ${{ inputs.offline }}
        SDK_DOCTOR_FAIL_ON: ${{ inputs.fail-on }}
        SDK_DOCTOR_RULES: ${{ inputs.rules }}
        SDK_DOCTOR_DISABLE: ${{ inputs.disable }}
        SDK_DOCTOR_RPC_URL: ${{ inputs.rpc-url }}
        SOLAMI_API_KEY: ${{ inputs.solami-api-key }}
        FORCE_COLOR: "1"
      run: |
        set +e
        md="$RUNNER_TEMP/solana-sdk-doctor.md"
        js="$RUNNER_TEMP/solana-sdk-doctor.json"
        args=("$SDK_DOCTOR_PATH" --fail-on "$SDK_DOCTOR_FAIL_ON" -o "$md" -o "$js")
        [ "$SDK_DOCTOR_OFFLINE" = "true" ] && args+=(--offline)
        [ -n "$SDK_DOCTOR_DISABLE" ] && args+=(--disable "$SDK_DOCTOR_DISABLE")
        [ -n "$SDK_DOCTOR_RPC_URL" ] && args+=(--rpc "$SDK_DOCTOR_RPC_URL")
        while IFS= read -r f; do
          f="$(echo "$f" | xargs)"; [ -n "$f" ] && args+=(--rules "$f")
        done < <(printf '%s\n' "$SDK_DOCTOR_RULES" | tr ',' '\n')

        node "$GITHUB_ACTION_PATH/action-dist/cli.js" "${args[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report-json=$js" >> "$GITHUB_OUTPUT"
        echo "report-markdown=$md" >> "$GITHUB_OUTPUT"
        if [ -f "$js" ]; then
          echo "fail-count=$(node -e "process.stdout.write(String(require('$js').summary.fail))")" >> "$GITHUB_OUTPUT"
          echo "warn-count=$(node -e "process.stdout.write(String(require('$js').summary.warn))")" >> "$GITHUB_OUTPUT"
          cat "$md" >> "$GITHUB_STEP_SUMMARY"
          # Inline annotations on the offending lines.
          node -e '
            const r = require(process.argv[1]);
            const level = { fail: "error", warn: "warning", info: "notice" };
            const base = process.argv[2];
            for (const f of r.findings) {
              if (!level[f.status]) continue;
              for (const l of f.locations.filter((l) => !l.mitigated)) {
                const file = (base === "." ? "" : base.replace(/\/$/, "") + "/") + l.file;
                console.log(`::${level[f.status]} file=${file},line=${l.line},title=${f.ruleId}::${f.title} - ${f.fix}`);
              }
            }' "$js" "$SDK_DOCTOR_PATH"
        fi
        exit 0

    - name: Comment on pull request
      if: ${{ inputs.comment == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && steps.doctor.outputs.report-markdown != '' }}
      uses: actions/github-script@v7
      continue-on-error: true
      env:
        REPORT_MD: ${{ steps.doctor.outputs.report-markdown }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const marker = "<!-- solana-sdk-doctor-report -->";
          const body = fs.readFileSync(process.env.REPORT_MD, "utf8");
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const existing = comments.find((c) => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Enforce result
      shell: bash
      env:
        CODE: ${{ steps.doctor.outputs.exit-code }}
        FAILS: ${{ steps.doctor.outputs.fail-count }}
        WARNS: ${{ steps.doctor.outputs.warn-count }}
      run: |
        if [ "$CODE" != "0" ]; then
          echo "::error title=Solana SDK Doctor::SDK drift detected (${FAILS:-?} fail, ${WARNS:-?} warn). See the job summary for fixes."
          exit "$CODE"
        fi
        echo "Solana SDK Doctor: no blocking drift."
