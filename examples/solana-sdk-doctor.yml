# Copy to .github/workflows/solana-sdk-doctor.yml in your dApp repo.
name: solana-sdk-doctor
on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch upstream drift even when your code didn't change
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # sticky PR comment

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: solana-sdk-doctor/solana-sdk-doctor@v0 # placeholder until the repo is published
        with:
          path: .
          fail-on: fail # or "warn" for stricter repos
          # rules: .sdk-doctor/rules.json   # optional project rule pack
          # rpc-url: ${{ secrets.SOLANA_RPC_URL }}
